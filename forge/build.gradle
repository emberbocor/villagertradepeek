plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.jarjar'
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        configureEach {
            args "--mixin.config=${mod_id}.mixins.json"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

jarJar.register()

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}")
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")
}

tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

tasks.named('jarJar') {
    archiveClassifier = null
}
