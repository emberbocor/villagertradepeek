# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

java_version=17

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The jar also runs on NeoForge 1.20.1, which reports itself as forge 47.1.x.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=47.1.0"
# Verify NeoForge with: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.106"
forge_version=47.4.26
forge_version_range=[47.1.0,)
forge_loader_version_range=[47,)
mixinextras_version=0.5.5

# Fabric. The jar is compiled against minecraft_version and declares fabric_minecraft_version_range.
# Check 1.20 with: ./gradlew :fabric:compileJava "-Pminecraft_version=1.20" "-Pfabric_api_version=0.83.0+1.20"
fabric_loader_version=0.19.5
# Fabric Loader 0.15.0 is the first version that bundles MixinExtras.
fabric_loader_version_range=>=0.15.0
fabric_api_version=0.92.12+1.20.1
# Minimum Fabric API, the version 1.20 is checked with. Build metadata (+1.20) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.83.0
fabric_minecraft_version_range=>=1.20 <=1.20.1
fabric_minecraft_label=1.20-1.20.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=villagertradepeek
# The human-readable display name for the mod.
mod_name=Villager Trade Peek
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.emberbocor.villagertradepeek
